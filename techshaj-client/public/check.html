<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connection check</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; color: #111; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f5; padding: 10px; border-radius: 8px; }
      .ok { color: #0a7d32; } .bad { color: #c0262d; }
    </style>
  </head>
  <body>
    <h1>TechShaj connection check</h1>
    <pre id="out">Running...</pre>
    <script>
      var API = 'https://techshaj-server.vercel.app'
      var out = document.getElementById('out')
      var lines = []
      function log(text, cls) { lines.push(text); out.textContent = lines.join('\n') }
      log('Browser: ' + navigator.userAgent)
      log('Page: ' + location.origin)
      log('Online: ' + navigator.onLine)
      function line(name, start, result) { log(name + ' -> ' + result + ' (' + (Date.now() - start) + ' ms)') }
      function viaFetch(path) {
        var t = Date.now()
        var ctrl = typeof AbortController === 'function' ? new AbortController() : null
        var timer = setTimeout(function () { ctrl && ctrl.abort() }, 40000)
        return fetch(API + path, ctrl ? { signal: ctrl.signal } : {})
          .then(function (r) { clearTimeout(timer); return r.text().then(function (b) { line('fetch ' + path, t, r.status + ', ' + b.length + ' bytes') }) })
          .catch(function (e) { clearTimeout(timer); line('fetch ' + path, t, 'FAILED: ' + e.name + ' ' + e.message) })
      }
      function viaXhr(path) {
        return new Promise(function (resolve) {
          var t = Date.now(), x = new XMLHttpRequest()
          x.open('GET', API + path); x.timeout = 40000
          x.onload = function () { line('xhr ' + path, t, x.status + ', ' + x.responseText.length + ' bytes'); resolve() }
          x.onerror = function () { line('xhr ' + path, t, 'FAILED (network or CORS)'); resolve() }
          x.ontimeout = function () { line('xhr ' + path, t, 'TIMEOUT 40s'); resolve() }
          x.send()
        })
      }
      function ownFile() {
        var t = Date.now()
        return fetch('/favicon.svg', { cache: 'no-store' })
          .then(function (r) { line('own site /favicon.svg', t, r.status) })
          .catch(function (e) { line('own site /favicon.svg', t, 'FAILED: ' + e.message) })
      }
      ownFile()
        .then(function () { return viaFetch('/') })
        .then(function () { return viaFetch('/settings') })
        .then(function () { return viaXhr('/home') })
        .then(function () { return viaXhr('/storefront') })
        .then(function () { log('Done. Send a screenshot of this page.') })
    </script>
  </body>
</html>
