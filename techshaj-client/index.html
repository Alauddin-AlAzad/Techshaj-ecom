<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>TechShaj</title>
    <script>
      // A cached page that points to scripts from an older deploy: reload once with a fresh URL.
      window.addEventListener('error', function (e) {
        var t = e.target
        if (!t || t.tagName !== 'SCRIPT' || !t.src || t.src.indexOf('/assets/') < 0) return
        try {
          if (sessionStorage.getItem('stale-reload')) return
          sessionStorage.setItem('stale-reload', '1')
        } catch (err) {}
        var q = location.search ? location.search + '&' : '?'
        location.replace(location.pathname + q + 'r=' + Date.now() + location.hash)
      }, true)
    </script>
    <style>
      body { margin: 0; background: #fff; }
      .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fff; opacity: 0; animation: boot-in 0.3s ease 0.3s forwards; }
      .boot img { width: 72px; height: 72px; border-radius: 16px; animation: boot-pulse 1.6s ease-in-out infinite; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 27, 141, 0.28), 0 6px 18px rgba(255, 27, 141, 0.18); }
        50% { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(255, 27, 141, 0), 0 10px 26px rgba(255, 27, 141, 0.28); }
      }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" role="status" aria-label="Loading"><img src="/src/assets/logo-mark.png" alt="" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
